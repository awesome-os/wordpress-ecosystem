name: Release Real WASI Runtime Bundle

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - packages/wp-env-wasi/**
      - .github/workflows/release-wasi-bundle.yml

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-wasi-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Fetch real upstream WASI binaries
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packages/wp-env-wasi/wasi-bundle-release.mts --mode fetch
      - name: Validate real WebAssembly binaries and emit manifest + SHA512SUMS
        env:
          PHP_SOURCE: ${{ steps.fetch.outputs.php_source }}
          SQLITE3_SOURCE: ${{ steps.fetch.outputs.sqlite3_source }}
          RUBY_SOURCE: ${{ steps.fetch.outputs.ruby_source }}
        run: node packages/wp-env-wasi/wasi-bundle-release.mts --mode validate
      - name: Create or update v11-wp-wasi-latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: node packages/wp-env-wasi/wasi-bundle-release.mts --mode publish
      - name: Attest SLSA Build Provenance for Real WASI Bundle
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/wasi-bundle/sqlite3-wasm32-wasi.wasm
            dist/wasi-bundle/php-wasm32-wasi.wasm
            dist/wasi-bundle/ruby-wasm32-wasi.wasm
            dist/wasi-bundle/wasi-bundle-manifest.json
